version: 0.2

env:
  variables:
    ANDROID_COMPILE_SDK: "35"
    ANDROID_BUILD_TOOLS: "35.0.0"
    ANDROID_SDK_TOOLS: "11076708"
    # Optional release signing (Base64-encoded keystore + passwords):
    # ANDROID_KEYSTORE_BASE64
    # ANDROID_KEYSTORE_PASSWORD
    # ANDROID_KEY_ALIAS
    # ANDROID_KEY_PASSWORD
  exported-variables:
    - ANDROID_HOME
    - PAPERPLANE_VERSION_NAME
    - PAPERPLANE_VERSION_CODE

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Installing Android SDK command-line tools"
      - export ANDROID_HOME="$HOME/android-sdk"
      - mkdir -p "$ANDROID_HOME/cmdline-tools"
      - |
        curl -fsSL -o /tmp/cmdline-tools.zip \
          "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip"
      - unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
      - mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
      - yes | sdkmanager --licenses >/dev/null || true
      - sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

  pre_build:
    commands:
      - export ANDROID_HOME="$HOME/android-sdk"
      - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
      - echo "sdk.dir=$ANDROID_HOME" > local.properties
      - chmod +x ./gradlew
      - git fetch --tags --force || echo "Could not fetch git tags; Semver uses the tags already in the checkout"
      - git fetch --unshallow || echo "Git history is already complete, or this checkout cannot be unshallowed"
      - |
        echo "Assigning timestamp build version for this CodeBuild run"
        export PAPERPLANE_VERSION_CODE=$(date -u +%s)
        if [ -z "${PAPERPLANE_VERSION_NAME:-}" ]; then
          export PAPERPLANE_VERSION_NAME=$(date -u +%Y.%m%d.%H%M%S)
        fi
        echo "PAPERPLANE_VERSION_NAME=$PAPERPLANE_VERSION_NAME"
        echo "PAPERPLANE_VERSION_CODE=$PAPERPLANE_VERSION_CODE"
      - |
        if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
          echo "Decoding release keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          export ANDROID_KEYSTORE_PATH=/tmp/release.keystore
        else
          echo "No release keystore provided; release APK will be unsigned or debug-signed"
        fi

  build:
    commands:
      - export ANDROID_HOME="$HOME/android-sdk"
      - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
      - echo "Building with version $PAPERPLANE_VERSION_NAME ($PAPERPLANE_VERSION_CODE)"
      - ./gradlew --no-daemon -p buildSrc test
      - ./gradlew --no-daemon printVersion
      - echo "Running unit tests"
      - ./gradlew --no-daemon test
      - echo "Building debug APK"
      - ./gradlew --no-daemon assembleDebug
      - echo "Building release APK"
      - ./gradlew --no-daemon assembleRelease
      - echo "Building release AAB"
      - ./gradlew --no-daemon bundleRelease

  post_build:
    commands:
      - |
        if [ -f /tmp/release.keystore ]; then
          echo "Removing temporary keystore"
          rm -f /tmp/release.keystore
        fi
      - |
        SAFE_NAME=$(echo "$PAPERPLANE_VERSION_NAME" | sed 's/[^A-Za-z0-9._-]/-/g')
        BASE="paperplane-${SAFE_NAME}-v${PAPERPLANE_VERSION_CODE}"
        mkdir -p dist
        DEBUG_APK=$(find app/build/outputs/apk/debug -name 'paperplane-*.apk' 2>/dev/null | head -1)
        if [ -z "$DEBUG_APK" ]; then
          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -1)
        fi
        RELEASE_APK=$(find app/build/outputs/apk/release -name 'paperplane-*.apk' 2>/dev/null | head -1)
        if [ -z "$RELEASE_APK" ]; then
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1)
        fi
        RELEASE_AAB=$(find app/build/outputs/bundle/release -name 'paperplane-*.aab' 2>/dev/null | head -1)
        if [ -z "$RELEASE_AAB" ]; then
          RELEASE_AAB=$(find app/build/outputs/bundle/release -name '*.aab' 2>/dev/null | head -1)
        fi
        if [ -n "$DEBUG_APK" ]; then
          cp "$DEBUG_APK" "dist/${BASE}-debug.apk"
        fi
        if [ -n "$RELEASE_APK" ]; then
          cp "$RELEASE_APK" "dist/${BASE}-release.apk"
        fi
        if [ -n "$RELEASE_AAB" ]; then
          cp "$RELEASE_AAB" "dist/${BASE}-release.aab"
        fi
        echo "Build artifacts:"
        find dist -type f \( -name "*.apk" -o -name "*.aab" \) -print
        find app/build/outputs -type f \( -name "paperplane-*.apk" -o -name "paperplane-*.aab" \) -print

artifacts:
  files:
    - dist/*
  discard-paths: yes

cache:
  paths:
    - /root/.gradle/caches/**/*
    - /root/.gradle/wrapper/**/*
    - /root/android-sdk/**/*
